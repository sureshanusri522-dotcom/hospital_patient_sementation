<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hospital Patient Segmentation</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div class="overlay"></div><div class="container"><div class="header"><div><h1 id="welcome">🏥 AI Hospital Dashboard</h1><p>Patient Segmentation & Healthcare Analytics</p></div><div><h3 id="today"></h3><h2 id="clock"></h2></div></div><button class="dark-btn" onclick="darkMode()">🌙 Dark Mode</button><div class="heartbeat">❤️</div><form action="/predict" method="POST"><label>Age</label><input type="number" name="Age" required><label>Gender</label><select name="Gender"><option>Male</option><option>Female</option></select><label>Blood Type</label><select name="Blood"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><label>Medical Condition</label><select name="Condition"><option>Arthritis</option><option>Asthma</option><option>Cancer</option><option>Diabetes</option><option>Hypertension</option><option>Obesity</option></select><label>Admission Type</label><select name="Admission"><option>Emergency</option><option>Elective</option><option>Urgent</option></select><label>Test Results</label><select name="Test"><option>Normal</option><option>Abnormal</option><option>Inconclusive</option></select><label>Billing Amount</label><input type="number" step="0.01" name="Billing" required><button type="submit">Predict Patient</button></form>{% if prediction %}<div class="result"><h2>Prediction Result</h2><h3 style="color:{{color}}">{{risk}}</h3><p>Cluster {{prediction}}</p><p>{{advice}}</p><button onclick="window.print()">🖨 Download Report</button></div>{% endif %}<footer><p>©2026 Hospital Patient Segmentation</p></footer></div><script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
